# Capa de pruebas sobre compose.prod.yml: misma topología que producción,
# con imágenes construidas en local, puertos locales y Mailpit.
#   docker compose -f compose.prod.yml -f compose.ci.yml --env-file .env.ci up -d --build
services:
  gateway:
    build: { context: ., dockerfile: services/gateway/Dockerfile, args: { RELEASE_SHA: "${RELEASE_SHA:-ci}" } }
    ports: ["8080:80"]
    environment:
      # Las pruebas hacen muchas altas desde la misma IP.
      RATE_AUTH: 600r/m
      RATE_PUBLIC: 6000r/m
      RATE_MCP: 6000r/m
      RATE_ICS: 600r/m
      BURST_AUTH: "500"
      BURST_PUBLIC: "2000"
  web:
    build: { context: ., dockerfile: services/web/Dockerfile, args: { RELEASE_SHA: "${RELEASE_SHA:-ci}" } }
    environment:
      HOST_LANG_MAP: ${HOST_LANG_MAP:-}
  api:
    build: { context: ., dockerfile: services/api/Dockerfile, args: { RELEASE_SHA: "${RELEASE_SHA:-ci}" } }
    environment:
      HOST_LANG_MAP: ${HOST_LANG_MAP:-}
      TEST_MODE: ${TEST_MODE:-}
      # Canales contra el servidor de captura: valores falsos, nunca reales (repositorio público).
      TELEGRAM_BOT_TOKEN: "000000:token-de-prueba"
      TELEGRAM_BOT_USERNAME: mcet_pruebas_bot
      TELEGRAM_API_URL: http://captura:4010/telegram
      SLACK_CLIENT_ID: cliente-de-prueba
      SLACK_CLIENT_SECRET: secreto-de-prueba
      SLACK_API_URL: http://captura:4010/slack
      SLACK_AUTHORIZE_URL: http://localhost:4010/slack/authorize
      WHATSAPP_TOKEN: token-de-prueba
      WHATSAPP_PHONE_NUMBER_ID: "000000000000000"
      WHATSAPP_API_URL: http://captura:4010/whatsapp
    depends_on:
      captura: { condition: service_healthy }
  calendar:
    build: { context: ., dockerfile: services/calendar/Dockerfile, args: { RELEASE_SHA: "${RELEASE_SHA:-ci}" } }
    environment:
      TEST_MODE: ${TEST_MODE:-}
  postgres:
    build: { context: ., dockerfile: services/postgres/Dockerfile }
  mailpit:
    image: axllent/mailpit:v1.31.4
    mem_limit: 64m
    environment:
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"
    ports: ["8025:8025"]
    networks: [frontend]
  # Imita Telegram, Slack y WhatsApp (tests/fakes/captura.mjs): nada sale a terceros en las pruebas.
  captura:
    image: node:24.21.0-alpine3.24
    mem_limit: 64m
    command: ["node", "/app/captura.mjs"]
    volumes: ["./tests/fakes:/app:ro"]
    ports: ["4010:4010"]
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, "http://127.0.0.1:4010/healthz"]
      interval: 5s
      retries: 10
    networks: [frontend]
