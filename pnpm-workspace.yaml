packages:
  - services/web
  - services/api
  - services/admin
  - services/admin/ui
  - packages/*
  - tools/*
  - tests/escenarios
  - tests/fakes

# Cadena de suministro: no instalar versiones publicadas hace menos de 24 h.
minimumReleaseAge: 1440

# Correcciones de seguridad en dependencias transitivas (parches compatibles).
overrides:
  fastify: 5.12.6
  glob: 14.0.2
  minimatch: 11.0.1
  zod: 4.6.7

# Solo estos paquetes pueden ejecutar scripts de instalación.
allowBuilds:
  esbuild: true
  "@bufbuild/buf": true
  sharp: true
  # Dependencias opcionales de testcontainers (SSH a Docker remoto): no se compilan.
  cpu-features: false
  ssh2: false
  protobufjs: false
  # Angular CLI (watch y caché): traen binarios precompilados por dependencias opcionales; no se compilan.
  "@parcel/watcher": false
  lmdb: false
  msgpackr-extract: false
