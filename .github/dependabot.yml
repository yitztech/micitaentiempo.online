version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    groups:
      npm: { patterns: ["*"] }
  - package-ecosystem: gomod
    directory: /services/calendar
    schedule: { interval: weekly }
    groups:
      gomod: { patterns: ["*"] }
  - package-ecosystem: docker
    directories: [/services/gateway, /services/web, /services/api, /services/calendar, /services/postgres]
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    groups:
      actions: { patterns: ["*"] }
