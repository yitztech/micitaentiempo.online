# Cada noche: catálogo completo de escenarios (con @reloj, capturas y accesibilidad), ZAP baseline y la
# prueba de carga corta sobre la topología de producción con sus límites de memoria.
name: Nocturno

on:
  schedule:
    - cron: "0 8 * * *" # 02:00 en Ciudad de México
  workflow_dispatch:

concurrency:
  group: nocturno
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  completo:
    name: Escenarios, seguridad y carga
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dominios locales
        run: echo "127.0.0.1 micitaentiempo.localhost myappointmentontime.localhost" | sudo tee -a /etc/hosts
      - name: Construir y levantar la topología de producción
        run: docker compose -f compose.prod.yml -f compose.ci.yml --env-file .env.ci -p ci up -d --build --wait
      - run: pnpm --filter @mcet/escenarios exec playwright install --with-deps chromium webkit
      - name: Catálogo completo de escenarios
        run: pnpm --filter @mcet/escenarios exec ./correr.sh
      - name: ZAP baseline (excepciones revisadas en tests/seguridad/zap-reglas.tsv)
        run: |
          mkdir -p zap && cp tests/seguridad/zap-reglas.tsv zap/ && chmod -R 777 zap
          docker run --rm --network host --add-host micitaentiempo.localhost:127.0.0.1 -v "$PWD/zap:/zap/wrk:rw" ghcr.io/zaproxy/zaproxy:2.17.0 \
            zap-baseline.py -t http://micitaentiempo.localhost:8080 -c zap-reglas.tsv -r zap.html
      - name: Carga (k6) y memoria por servicio
        run: |
          mkdir -p tests/carga/resultados
          (for _ in $(seq 1 60); do docker stats --no-stream --format '{{.Name}} {{.MemUsage}} {{.CPUPerc}}' >> tests/carga/resultados/stats.txt; sleep 5; done) &
          docker run --rm --network host --add-host micitaentiempo.localhost:127.0.0.1 -e MAIL=http://localhost:8025 -v "$PWD/tests/carga:/carga" \
            grafana/k6:2.3.0 run --summary-export /carga/resultados/resumen.json /carga/carga.js
          wait
      - name: Logs si falla
        if: failure()
        run: docker compose -p ci logs --no-color | tail -n 300
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: nocturno
          path: |
            tests/escenarios/playwright-report*
            tests/escenarios/cucumber-report*
            zap/zap.html
            tests/carga/resultados
          retention-days: 14
