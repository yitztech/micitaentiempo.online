# Integración continua. También la reutiliza deploy.yml antes de publicar imágenes:
# si algo falla, no se publica nada.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]
  workflow_call:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  ts:
    name: TypeScript
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci .
      - run: pnpm i18n:check
      - run: pnpm typecheck
      - run: pnpm test

  go:
    name: Go
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/calendar
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/calendar/go.mod
          cache-dependency-path: services/calendar/go.sum
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.14.0
          working-directory: services/calendar
      - run: go test -race ./...

  contratos:
    name: Contratos (buf)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/setup-go@v7
        with:
          go-version-file: services/calendar/go.mod
          cache-dependency-path: services/calendar/go.sum
      - run: pnpm install --frozen-lockfile
      - name: Lint y código generado al día
        run: |
          pnpm --filter @mcet/contracts exec sh -c 'buf lint && buf generate'
          git diff --exit-code -- packages/contracts/gen services/calendar/gen
      - name: Cambios incompatibles frente a main
        working-directory: packages/contracts
        run: |
          if git cat-file -e origin/main:packages/contracts/proto 2>/dev/null; then
            pnpm exec buf breaking --against "../../.git#branch=origin/main,subdir=packages/contracts/proto"
          else
            echo "main aún no tiene contratos: nada que comparar"
          fi

  secretos:
    name: Secretos en el historial (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      # Imagen oficial (la acción exige licencia en organizaciones). Excepciones revisadas en .gitleaksignore.
      - run: >-
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo
          --no-banner --redact --gitleaks-ignore-path /repo/.gitleaksignore

  gateway:
    name: Configuración de nginx
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -f services/gateway/Dockerfile -t gateway-test .
      - name: nginx -t con la plantilla resuelta
        run: |
          docker run --rm --add-host web:127.0.0.1 --add-host api:127.0.0.1 --add-host calendar:127.0.0.1 \
            -e TRUSTED_PROXY_CIDR=10.0.0.0/8 gateway-test \
            sh -c '/docker-entrypoint.sh nginx -t'

  escenarios:
    name: Imágenes y escenarios
    runs-on: ubuntu-latest
    needs: [ts, go, contratos]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Dominios locales
        run: echo "127.0.0.1 micitaentiempo.localhost myappointmentontime.localhost" | sudo tee -a /etc/hosts
      - name: Construir y levantar la topología de producción
        run: docker compose -f compose.prod.yml -f compose.ci.yml --env-file .env.ci -p ci up -d --build --wait
      - name: Escanear imágenes (vulnerabilidades críticas con arreglo)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: local/micitaentiempo-api:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - run: pnpm --filter @mcet/escenarios exec playwright install --with-deps chromium webkit
      - name: Escenarios @humo y @critico
        run: pnpm --filter @mcet/escenarios exec ./correr.sh --grep "@humo|@critico"
      - name: Logs si falla
        if: failure()
        run: docker compose -p ci logs --no-color | tail -n 300
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: informe-escenarios
          path: |
            tests/escenarios/playwright-report*
            tests/escenarios/cucumber-report*
          retention-days: 14
