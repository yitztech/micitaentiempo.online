# Publica las imágenes en GHCR y despliega en Coolify cuando cambia main.
#
#   pruebas (ci.yml) → publicar (5 imágenes) → desplegar (webhook de Coolify) → comprobar
#
# El entorno `production` (secretos COOLIFY_WEBHOOK y COOLIFY_TOKEN, variable SITE_URL)
# lo rellena el alta del cliente. Mientras no exista, se publican las imágenes pero no se despliega.
name: Desplegar

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  pruebas:
    name: Pruebas
    uses: ./.github/workflows/ci.yml

  publicar:
    name: Publicar ${{ matrix.name }}
    needs: pruebas
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        name: [gateway, web, api, calendar, postgres]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # GHCR exige minúsculas en el nombre de la imagen
      - id: image
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: services/${{ matrix.name }}/Dockerfile
          push: true
          build-args: |
            RELEASE_SHA=${{ github.sha }}
          tags: |
            ${{ steps.image.outputs.name }}:main
            ${{ steps.image.outputs.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          provenance: true
          sbom: true

  desplegar:
    name: Desplegar en Coolify
    needs: publicar
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: ¿Coolify está configurado?
        id: coolify
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          if [ -n "$COOLIFY_WEBHOOK" ] && [ -n "$COOLIFY_TOKEN" ] && [ -n "$SITE_URL" ]; then
            echo "listo=true" >> "$GITHUB_OUTPUT"
          else
            echo "listo=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Imágenes publicadas, pero no se despliega: faltan COOLIFY_WEBHOOK, COOLIFY_TOKEN o SITE_URL en el entorno production."
          fi

      - name: Pedir el despliegue a Coolify
        if: steps.coolify.outputs.listo == 'true'
        env:
          COOLIFY_WEBHOOK: ${{ secrets.COOLIFY_WEBHOOK }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error --retry 3 --max-time 60 \
            --request POST --header "Authorization: Bearer $COOLIFY_TOKEN" "$COOLIFY_WEBHOOK"

      # Cada redespliegue corta el sitio ~1 minuto: se espera a que el gateway y la API
      # sirvan el commit nuevo.
      - name: Comprobar que la versión nueva ya sirve
        if: steps.coolify.outputs.listo == 'true'
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          for attempt in $(seq 1 60); do
            gateway=$(curl --fail --silent --max-time 10 "$SITE_URL/version.json" | jq -r '.revision' || true)
            api=$(curl --fail --silent --max-time 10 "$SITE_URL/api/healthz" | jq -r '.revision' || true)
            if [ "$gateway" = "$EXPECTED_SHA" ] && [ "$api" = "$EXPECTED_SHA" ]; then
              echo "Desplegado: $EXPECTED_SHA"
              exit 0
            fi
            if [ "$attempt" -eq 60 ]; then
              echo "::error::Coolify no sirvió la revisión esperada en 10 minutos (gateway=$gateway, api=$api)."
              exit 1
            fi
            sleep 10
          done
