syntax = "proto3";

package mcet.calendar.v1;

import "google/protobuf/timestamp.proto";

// Horarios libres (docs/plan/04-motor-calendario.md §4.4).
service AvailabilityService {
  rpc GetSlots(GetSlotsRequest) returns (GetSlotsResponse);
}

message GetSlotsRequest {
  string calendar_id = 1;
  string service_id = 2;
  google.protobuf.Timestamp from = 3;
  google.protobuf.Timestamp to = 4;
}

message Slot {
  google.protobuf.Timestamp start = 1;
  google.protobuf.Timestamp end = 2;
  int32 seats_free = 3;
}

message GetSlotsResponse {
  repeated Slot slots = 1;
  // Zona del tablero, para mostrarla junto a la del visitante.
  string timezone = 2;
}
