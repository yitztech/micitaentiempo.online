version: "2"
linters:
  default: standard
  enable:
    - bodyclose
    - errorlint
    - gosec
    - noctx
    - nilerr
    - rowserrcheck
    - sqlclosecheck
    - unconvert
  settings:
    gosec:
      excludes: [G104]
  exclusions:
    paths: [gen]
    rules:
      # Secretos ficticios en pruebas.
      - path: _test\.go
        linters: [gosec]
formatters:
  enable: [gofmt, goimports]
