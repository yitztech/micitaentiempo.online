# Cabeceras comunes. CSP, X-Frame-Options, Permissions-Policy y COOP las ponen los servicios,
# porque dependen de la página (nonce, embed, facturación). Se incluye en cada location:
# en nginx, un add_header dentro de una location anula los heredados.
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
